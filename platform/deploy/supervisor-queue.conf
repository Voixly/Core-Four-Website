[program:corefour-queue]
process_name=%(program_name)s
command=php /var/www/corefour/artisan queue:work --sleep=1 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/corefour/storage/logs/queue.log
stopwaitsecs=3600
